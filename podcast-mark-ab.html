<title>Podcast Mark A/B</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Merriweather:wght@900&display=swap');

:root{
  --page:#06070A;
  --label:#7F858E;
  --label-hi:#E8E9EB;
  --round:#9BB0C7;
  --orange:#FF9500;
  --rule:#23272E;
  --panel:#0E1115;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--page);
  color:var(--label);
  font-family:"DM Sans",ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  padding:40px 20px 120px;
}
.wrap{max-width:1120px;margin:0 auto}
section{margin:0 0 84px}

.round{
  border-top:1px solid rgba(155,176,199,.32);
  color:var(--round);
  font-size:11px;
  letter-spacing:.30em;
  text-transform:uppercase;
  padding-top:14px;
  margin:0 0 52px;
}
.round + section{margin-top:0}
.wrap > .round ~ .round{margin-top:44px}

.lbl{
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--label);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.lbl-hi{color:var(--label-hi)}
.lbl-key{color:var(--orange)}
.sub{display:block;margin-top:5px;color:var(--label);letter-spacing:.10em}

.scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.scroll:focus-visible{outline:2px solid var(--orange);outline-offset:4px}
.rail{display:table;width:max-content;border-spacing:0}

.tile{display:block;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.10)}
.tile.circ{border-radius:50%}

.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.hero figure{margin:0}
.hero .tile{width:100%;height:auto;aspect-ratio:1/1}
.hero figcaption{margin-top:12px}

.r{display:table-row}
.r > div{display:table-cell;vertical-align:middle;padding:0 26px 26px 0}
.r.head > div{vertical-align:bottom;padding-bottom:12px}
.rowlbl{width:56px;min-width:56px;padding-right:14px !important}
.k{background:var(--panel);border-left:1px solid var(--rule);padding-left:26px !important;padding-right:26px !important}

.g > div{display:table-cell;vertical-align:middle;padding:0 18px 18px 0}
.g.head > div{vertical-align:bottom;padding-bottom:12px}

.word{background:#0A0C0E;padding:38px 30px}
.word svg{display:block;height:auto}
.wordcap{margin:0 0 22px}
.wordcap .lbl{margin-top:12px}
</style>

</head>
